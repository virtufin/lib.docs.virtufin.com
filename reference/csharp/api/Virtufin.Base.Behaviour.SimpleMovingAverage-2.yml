  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Behaviour
  summary: >-
    Time-windowed simple moving average. "Simple" describes the averaging

    method (uniformly-weighted mean), not the implementation — count-based

    windowing is the special case where samples happen to arrive at a regular

    cadence, so this is windowed by time in general.
  remarks: >-
    Immutable: <xref href="Virtufin.Base.Behaviour.SimpleMovingAverage%602.Add(Virtufin.Core.Events.TimestampedSample%7b%600%2c%601%7d)" data-throw-if-not-resolved="false"></xref> returns a new instance, safe to carry inside

    an <code>IStrategyState</code> record without mutation. Backed by an

    <xref href="System.Collections.Immutable.ImmutableQueue%601" data-throw-if-not-resolved="false"></xref> of in-window samples (append at back,

    evict from front, peek front — O(1) amortized per operation), with a

    running sum maintained incrementally rather than resummed on every

    <xref href="Virtufin.Base.Behaviour.SimpleMovingAverage%602.Value" data-throw-if-not-resolved="false"></xref> read.
  example: []
  syntax:
    content: 'public sealed class SimpleMovingAverage<TTime, TValue> : IIndicator<SimpleMovingAverage<TTime, TValue>, TimestampedSample<TTime, TValue>, TValue>, ISignal<TValue> where TTime : IComparable<TTime> where TValue : IAdditionOperators<TValue, TValue, TValue>, ISubtractionOperators<TValue, TValue, TValue>, IDivisionOperators<TValue, TValue, TValue>'
    typeParameters:
    - id: TTime
      description: The sample time type.
    - id: TValue
      description: The sample/average value type.
    content.vb: Public NotInheritable Class SimpleMovingAverage(Of TTime As IComparable(Of TTime), TValue As {IAdditionOperators(Of TValue, TValue, TValue), ISubtractionOperators(Of TValue, TValue, TValue), IDivisionOperators(Of TValue, TValue, TValue)}) Implements IIndicator(Of SimpleMovingAverage(Of TTime, TValue), TimestampedSample(Of TTime, TValue), TValue), ISignal(Of TValue)
