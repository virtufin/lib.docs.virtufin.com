  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Behaviour
  summary: Construct an empty average with no samples yet.
  example: []
  syntax:
    content: public static SimpleMovingAverage<TTime, TValue> Empty(Func<int, TValue> fromCount, Func<TTime, TTime, bool> isExpired)
    parameters:
    - id: fromCount
      type: System.Func{System.Int32,{TValue}}
      description: >-
        Converts a sample count into a <code class="typeparamref">TValue</code>
            divisor — reusable across every <xref href="Virtufin.Base.Behaviour.SimpleMovingAverage%602.Add(Virtufin.Core.Events.TimestampedSample%7b%600%2c%601%7d)" data-throw-if-not-resolved="false"></xref> call, since the in-window count
            varies under time-based windowing (e.g. for <code>decimal</code>: <code>count =&gt; (decimal)count</code>).
    - id: isExpired
      type: System.Func{{TTime},{TTime},System.Boolean}
      description: >-
        Called as <code>isExpired(oldestSampleTime, newestTime)</code> during
            eviction to decide whether the oldest in-window sample has fallen out of the window
            (e.g. for <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref>: <code>(old, latest) =&gt; (latest - old) &gt; windowDuration</code>).
    return:
      type: Virtufin.Base.Behaviour.SimpleMovingAverage`2
    content.vb: Public Shared Function Empty(fromCount As Func(Of Integer, TValue), isExpired As Func(Of TTime, TTime, Boolean)) As SimpleMovingAverage(Of TTime, TValue)
