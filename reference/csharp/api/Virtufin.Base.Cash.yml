    path: ../../../src/Virtufin.Base/Cash.cs
    startLine: 16
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    Currency-tagged fixed-point quantity. <xref href="Virtufin.Base.Cash.Amount" data-throw-if-not-resolved="false"></xref> carries its own

    precision (<xref href="Virtufin.Core.Position.DecimalAmount.N" data-throw-if-not-resolved="false"></xref>) so two <xref href="Virtufin.Base.Cash" data-throw-if-not-resolved="false"></xref> values

    representing the same monetary amount at different precisions are not

    equal.
  example:
  - >-
    <pre><code class="lang-csharp">var price = new Cash(Currency.CurrencySymbol.USD, new DecimalAmount(99, 95, 2));

    Console.WriteLine(price); // "USD 99.95"</code></pre>
