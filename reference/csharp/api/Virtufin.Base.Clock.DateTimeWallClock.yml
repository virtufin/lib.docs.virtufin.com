  namespace: Virtufin.Base.Clock
  summary: >-
    Construct a wall clock that emits <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> every

    <code class="paramref">interval</code>. The n-th emission (n ≥ 1) equals

    <code>DateTimeOffset.UtcNow + n * interval</code> evaluated at emission time.
  example: []
  syntax:
    content: public DateTimeWallClock(TimeSpan interval)
    parameters:
    - id: interval
      type: System.TimeSpan
      description: Time between emissions. Must be &gt; <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Sub New(interval As TimeSpan)
  overload: Virtufin.Base.Clock.DateTimeWallClock.#ctor*
