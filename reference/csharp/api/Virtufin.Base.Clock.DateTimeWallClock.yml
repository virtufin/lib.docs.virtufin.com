  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Clock
  summary: >-
    The canonical <code>IClock&lt;DateTimeOffset&gt;</code> implementation. Emits a

    <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> every <code class="paramref">interval</code>, where

    the n-th emission is <code>DateTimeOffset.UtcNow + n * interval</code>.
  remarks: >-
    This is the "regular" wall clock — the projection from a regular

    <xref href="Virtufin.Base.Clock.Metronome%601" data-throw-if-not-resolved="false"></xref>-like tick to wall time. The actual emission

    is driven by Observable.Interval(TimeSpan, TimeSpan) rather

    than by wrapping a <xref href="Virtufin.Base.Clock.Metronome%601" data-throw-if-not-resolved="false"></xref>, because the wall-clock

    projection reads <code>DateTimeOffset.UtcNow</code> at the moment of emission

    (a Metronome would freeze the projected time at subscription time).
  example: []
  syntax:
    content: 'public sealed class DateTimeWallClock : IClock<DateTimeOffset>, IObservable<DateTimeOffset>'
    content.vb: Public NotInheritable Class DateTimeWallClock Implements IClock(Of DateTimeOffset), IObservable(Of DateTimeOffset)
