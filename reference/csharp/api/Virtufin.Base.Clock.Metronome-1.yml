  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Clock
  summary: >-
    The primitive regular-tick clock source. Emits a <code class="typeparamref">T</code>

    value at a fixed <xref href="Virtufin.Base.Clock.Metronome%601.Interval" data-throw-if-not-resolved="false"></xref>. Each emission corresponds to a

    tick: <code>T</code> values can carry the wall-time (e.g. a

    <code>DateTimeOffset</code>) or a sequence number projected to any

    <code class="typeparamref">T</code> the consumer needs.
  remarks: >-
    The user-facing abstraction is <xref href="Virtufin.Core.Clock.IClock%601" data-throw-if-not-resolved="false"></xref>. The

    <code>Metronome</code> is a regular-tick implementation. For "induced by

    actions" scenarios (e.g. backtest replay), the test driver emits via

    a <xref href="System.Reactive.Subjects.Subject%601" data-throw-if-not-resolved="false"></xref> cast to <code>IClock&lt;T&gt;</code> instead of

    using a Metronome.
  example: []
  syntax:
    content: 'public sealed class Metronome<T> : IClock<T>, IObservable<T> where T : struct, IComparable<T>'
    typeParameters:
    - id: T
      description: Time representation emitted by this clock. See <xref href="Virtufin.Core.Clock.IClock%601" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public NotInheritable Class Metronome(Of T As {Structure, IComparable(Of T)}) Implements IClock(Of T), IObservable(Of T)
