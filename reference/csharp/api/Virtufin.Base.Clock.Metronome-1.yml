  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Clock
  summary: >-
    Construct a metronome that emits <code class="typeparamref">T</code> at <code class="paramref">interval</code>.

    The <code class="paramref">projection</code> maps the tick sequence number (0, 1, 2, ...)

    to a <code class="typeparamref">T</code> value.
  example: []
  syntax:
    content: public Metronome(TimeSpan interval, Func<long, T> projection)
    parameters:
    - id: interval
      type: System.TimeSpan
      description: Time between emissions. Must be &gt; <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref>.
    - id: projection
      type: System.Func{System.Int64,{T}}
      description: Maps the sequence number to a T value.
    content.vb: Public Sub New(interval As TimeSpan, projection As Func(Of Long, T))
  overload: Virtufin.Base.Clock.Metronome`1.#ctor*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">interval</code> is &lt;= <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref>.
