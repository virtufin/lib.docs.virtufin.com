  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Clock
  summary: >-
    Convenience factory: create an <code>IClock&lt;DateTimeOffset&gt;</code> that emits

    <code>DateTimeOffset.UtcNow</code> every <code class="paramref">interval</code>.
  example: []
  syntax:
    content: public static IClock<DateTimeOffset> CreateDateTimeWallClock(TimeSpan interval)
    parameters:
    - id: interval
      type: System.TimeSpan
      description: Time between emissions. Must be &gt; <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Virtufin.Core.Clock.IClock{System.DateTimeOffset}
    content.vb: Public Shared Function CreateDateTimeWallClock(interval As TimeSpan) As IClock(Of DateTimeOffset)
  overload: Virtufin.Base.Clock.Metronome.CreateDateTimeWallClock*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">interval</code> is &lt;= <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref>.
