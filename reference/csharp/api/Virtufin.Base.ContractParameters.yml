  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    Concrete <xref href="Virtufin.Core.Contracts.IContractParameters" data-throw-if-not-resolved="false"></xref> backed by a raw byte payload.

    Callers serialise their domain-specific parameters (e.g. via FlatBuffers,

    MessagePack, JSON) into the byte array and reconstruct them at the

    contract.
  remarks: >-
    This avoids a hard dependency on <code>Virtufin.Data.Variant</code> so that

    <code>Virtufin.Base</code> remains usable even when higher-level serialisation

    libraries are absent.
  example: []
  syntax:
    content: 'public readonly record struct ContractParameters : IContractParameters, IEquatable<IContractParameters>, IEquatable<ContractParameters>'
    content.vb: Public Structure ContractParameters Implements IContractParameters, IEquatable(Of IContractParameters), IEquatable(Of ContractParameters)
