  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    ISO 4217 currency codes. Includes all active national currencies and

    "X-" fund codes (precious metals, supranationals, testing). Historical /

    withdrawn codes (ADP, DEM, FRF, etc.) are intentionally omitted.
  remarks: >-
    Reference: <code>https://en.wikipedia.org/wiki/ISO_4217</code> — "Active codes

    (list one)" as of January 2026. ZZZ is a non-ISO sentinel used internally

    for tests / "no currency" cases.
