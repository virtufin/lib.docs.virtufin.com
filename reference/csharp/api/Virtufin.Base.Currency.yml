  namespace: Virtufin.Base
  summary: >-
    Parse a three-letter currency code into a <xref href="Virtufin.Base.Currency.CurrencySymbol" data-throw-if-not-resolved="false"></xref>.

    Accepts both ISO 4217 codes and the internal <code>ZZZ</code> sentinel.
  example: []
  syntax:
    content: public static Currency.CurrencySymbol Parse(string code)
    parameters:
    - id: code
      type: System.String
      description: Three-letter code (case-sensitive).
    return:
      type: Virtufin.Base.Currency.CurrencySymbol
    content.vb: Public Shared Function Parse(code As String) As Currency.CurrencySymbol
  overload: Virtufin.Base.Currency.Parse*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when <code class="paramref">code</code> is not a known currency.
