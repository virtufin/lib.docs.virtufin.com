  summary: >-
    Enriched market events — derived signals (candles, VWAP, volatility) plus

    pass-through for raw <xref href="Virtufin.Base.Events.Market.MarketEvent" data-throw-if-not-resolved="false"></xref>s. Both flow through the

    same <code>act.market.*</code> / <code>hyp.{selector}.market.*</code> topics since

    they share the <xref href="Virtufin.Core.Events.Market.IMarketEvent" data-throw-if-not-resolved="false"></xref> marker.
