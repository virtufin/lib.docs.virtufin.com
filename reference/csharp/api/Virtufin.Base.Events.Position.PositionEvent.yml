  summary: >-
    Sealed algebraic data type of position events. The unified stream driving

    all holdings changes — funding, deposits, withdrawals, AND fills (a fill

    produces two <xref href="Virtufin.Base.Events.Position.PositionEvent.Updated" data-throw-if-not-resolved="false"></xref> events atomically, one per side of the

    trade). Topics use the naming scheme

    <code>sc.{scenarioId}.position.{entity}.{event}</code>.
