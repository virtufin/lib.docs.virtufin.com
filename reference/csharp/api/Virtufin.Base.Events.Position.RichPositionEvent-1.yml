    <xref href="Virtufin.Base.Events.Position.PositionEvent%601" data-throw-if-not-resolved="false"></xref> but with attribution, party info, and a

    pass-through case for the raw event. Use this when consumers need to know

    who initiated the change (e.g. transfer counterparty info).
