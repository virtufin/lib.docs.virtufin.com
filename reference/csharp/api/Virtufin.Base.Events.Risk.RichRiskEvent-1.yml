  summary: >-
    Enriched risk events — same <xref href="Virtufin.Core.Events.Risk.IRiskEvent%601" data-throw-if-not-resolved="false"></xref> marker as

    <xref href="Virtufin.Base.Events.Risk.RiskEvent%601" data-throw-if-not-resolved="false"></xref> but with attribution metadata and a pass-through

    case for the raw event.
  example: []
  syntax:
    content: 'public abstract record RichRiskEvent<T> : IRiskEvent<T>, IEvent<T>, IEquatable<IEvent<T>>, IEquatable<RichRiskEvent<T>> where T : struct, IComparable<T>'
    typeParameters:
    - id: T
      description: >-
        The event's own time type. Constrained to <code>struct</code> here
            (unlike the other generic event hierarchies) because <xref href="Virtufin.Base.Events.Risk.RichRiskEvent%601.DrawdownWithMetadata" data-throw-if-not-resolved="false"></xref>
            needs genuine value-type nullability for <code>RecoveryTime</code> — an unconstrained
            <code>T?</code> would silently collapse to non-nullable <code>T</code> for value types.
    content.vb: Public MustInherit Class RichRiskEvent(Of T As {Structure, IComparable(Of T)}) Implements IRiskEvent(Of T), IEvent(Of T), IEquatable(Of IEvent(Of T)), IEquatable(Of RichRiskEvent(Of T))
