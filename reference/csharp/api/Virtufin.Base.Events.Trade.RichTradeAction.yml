  name: RichTradeAction
  nameWithType: RichTradeAction
  fullName: Virtufin.Base.Events.Trade.RichTradeAction
  type: Class
  source:
    remote:
      path: src/Virtufin.Base/Events/Trade/RichTradeAction.cs
      branch: master
      repo: https://gitea.haenerconsulting.com/virtufin/virtufin-dotnet
    id: RichTradeAction
    path: ../../../src/Virtufin.Base/Events/Trade/RichTradeAction.cs
    startLine: 18
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Events.Trade
  summary: >-
    Enriched trade action — wraps a raw <xref href="Virtufin.Base.Events.Trade.TradeAction" data-throw-if-not-resolved="false"></xref> with metadata

    the strategy attaches before execution (strategy attribution, latency

    budget, routing venue, etc.). Implements the same <xref href="Virtufin.Core.Events.Trade.ITradeAction" data-throw-if-not-resolved="false"></xref>

    marker so it flows through the same <xref href="Virtufin.Core.Events.Trade.ITradeEvent%601" data-throw-if-not-resolved="false"></xref>

    parameterisation as raw actions.
  remarks: >-
    Each <xref href="Virtufin.Base.Events.Trade.RichTradeAction" data-throw-if-not-resolved="false"></xref> case carries the underlying

    <xref href="Virtufin.Base.Events.Trade.TradeAction" data-throw-if-not-resolved="false"></xref> plus per-case enrichment fields. Pattern matching

    exhaustiveness is preserved: producers that emit <xref href="Virtufin.Base.Events.Trade.RichTradeAction" data-throw-if-not-resolved="false"></xref>

    are forced to handle every case.
  example: []
  syntax:
    content: 'public abstract record RichTradeAction : ITradeAction, IEvent, IEquatable<IEvent>, IEquatable<RichTradeAction>'
    content.vb: Public MustInherit Class RichTradeAction Implements ITradeAction, IEvent, IEquatable(Of IEvent), IEquatable(Of RichTradeAction)
