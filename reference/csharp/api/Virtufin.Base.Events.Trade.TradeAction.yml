    startLine: 20
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Events.Trade
  summary: >-
    Sealed algebraic data type of trade actions — the strategy's intent

    before enrichment. Cases:


    <ul><li><xref href="Virtufin.Base.Events.Trade.TradeAction.BuyOrder" data-throw-if-not-resolved="false"></xref>: limit/market buy on a CLOB.</li><li><xref href="Virtufin.Base.Events.Trade.TradeAction.SellOrder" data-throw-if-not-resolved="false"></xref>: limit/market sell on a CLOB.</li><li><xref href="Virtufin.Base.Events.Trade.TradeAction.CancelOrder" data-throw-if-not-resolved="false"></xref>: cancel a previously placed order.</li><li><xref href="Virtufin.Base.Events.Trade.TradeAction.TransferAction" data-throw-if-not-resolved="false"></xref>: peer-to-peer transfer between two parties
      (no exchange).</li><li><xref href="Virtufin.Base.Events.Trade.TradeAction.InterestAction" data-throw-if-not-resolved="false"></xref>: express interest in a CLOB before commitment
      — no risk, no book impact.</li><li><xref href="Virtufin.Base.Events.Trade.TradeAction.WithdrawInterestAction" data-throw-if-not-resolved="false"></xref>: revoke a previously registered interest.</li></ul>
  example: []
  syntax:
    content: 'public abstract record TradeAction : ITradeAction, IEvent, IEquatable<IEvent>, IEquatable<TradeAction>'
    content.vb: Public MustInherit Class TradeAction Implements ITradeAction, IEvent, IEquatable(Of IEvent), IEquatable(Of TradeAction)
