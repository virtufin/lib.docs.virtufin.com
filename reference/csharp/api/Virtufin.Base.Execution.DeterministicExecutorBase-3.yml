    id: Process
    path: ../../../src/Virtufin.Base/Execution/Executors.cs
    startLine: 92
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Subclass hook: given the current state and an action, produce the next

    state and the outcome event.
  remarks: >-
    Implementations typically pattern-match on the concrete

    <code class="typeparamref">TAction</code> ADT (e.g. <code>BuyOrder</code>, <code>SellOrder</code>,

    <code>CancelOrder</code>) and emit the appropriate <code class="typeparamref">TEvent</code>

    subtype (e.g. <code>FillReceived</code>, <code>OrderCancelled</code>). All pricing

    decisions live here — the base does not assume a mid-price. Purely

    synchronous by design (no IO) -- <xref href="Virtufin.Base.Execution.DeterministicExecutorBase%603.ExecuteAsync(%600%2c%601)" data-throw-if-not-resolved="false"></xref> wraps the

    result in a completed <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected abstract (TState NextState, TEvent Event) Process(TState state, TAction action)
    parameters:
    - id: state
      type: '{TState}'
      description: Current executor state.
    - id: action
      type: '{TAction}'
      description: The trade action to process.
    return:
      type: System.ValueTuple{{TState},{TEvent}}
      description: Tuple of (next state, outcome event).
    content.vb: Protected MustOverride Function Process(state As TState, action As TAction) As (NextState As TState, [Event] As TEvent)
