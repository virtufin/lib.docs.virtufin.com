  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Pure deterministic executor base: no randomness, no IO, no hidden state.

    Subclasses define the case-by-case fill logic (what event to emit for

    each <code class="typeparamref">TAction</code> variant) and the initial state.
  remarks: >-
    Template method pattern. The base owns the Execute flow and

    delegates to <xref href="Virtufin.Base.Execution.DeterministicExecutorBase%603.Process(%600%2c%601)" data-throw-if-not-resolved="false"></xref>. Pricing strategy (limit price, mid

    price, custom feed, etc.) is the subclass's concern — defined inside

    <xref href="Virtufin.Base.Execution.DeterministicExecutorBase%603.Process(%600%2c%601)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public abstract class DeterministicExecutorBase<TState, TAction, TEvent> : IExecutor<TState, TAction, TEvent> where TState : IExecutionState where TAction : ITradeAction where TEvent : ITradeEvent<TAction, DateTimeOffset>'
    typeParameters:
