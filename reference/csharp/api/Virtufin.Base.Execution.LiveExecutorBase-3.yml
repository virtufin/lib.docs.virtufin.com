    id: Process
    path: ../../../src/Virtufin.Base/Execution/Executors.cs
    startLine: 200
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Subclass hook: route the action to the exchange and emit the

    resulting event.
  remarks: >-
    Production subclasses will marshal the action to a wire protocol

    (REST, FIX, gRPC, native API), await the exchange's response, and

    translate it to a <code class="typeparamref">TEvent</code>. In development

    subclasses may choose to no-op, log, or delegate to a local

    simulation — the base does not constrain this.
  example: []
  syntax:
    content: protected abstract (TState NextState, TEvent Event) Process(TState state, TAction action)
    parameters:
    - id: state
      type: '{TState}'
      description: Current executor state.
    - id: action
      type: '{TAction}'
      description: The trade action to route.
    return:
      type: System.ValueTuple{{TState},{TEvent}}
      description: Tuple of (next state, outcome event).
    content.vb: Protected MustOverride Function Process(state As TState, action As TAction) As (NextState As TState, [Event] As TEvent)
  overload: Virtufin.Base.Execution.LiveExecutorBase`3.Process*
