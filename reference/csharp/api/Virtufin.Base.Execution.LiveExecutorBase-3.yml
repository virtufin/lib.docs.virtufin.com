  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Live executor base for routing actions to a real exchange. Subclasses

    define the exchange-routing strategy in <xref href="Virtufin.Base.Execution.LiveExecutorBase%603.Process(%600%2c%601)" data-throw-if-not-resolved="false"></xref>. No

    assumptions about routing, fallback, or state evolution — all in the subclass.
  remarks: >-
    Template method pattern. <xref href="Virtufin.Base.Execution.LiveExecutorBase%603.Execute(%600%2c%601)" data-throw-if-not-resolved="false"></xref> delegates directly to

    <xref href="Virtufin.Base.Execution.LiveExecutorBase%603.Process(%600%2c%601)" data-throw-if-not-resolved="false"></xref>; subclasses own the full routing flow. The base

    previously held a deterministic fallback for development; that has been

    removed to keep the base free of routing-strategy assumptions. Subclasses

    may compose a fallback of their own if they want one.
  example: []
  syntax:
    content: 'public abstract class LiveExecutorBase<TState, TAction, TEvent> : IExecutor<TState, TAction, TEvent> where TState : IExecutionState where TAction : ITradeAction where TEvent : ITradeEvent<TAction>'
    typeParameters:
    - id: TState
    - id: TAction
    - id: TEvent
    content.vb: Public MustInherit Class LiveExecutorBase(Of TState As IExecutionState, TAction As ITradeAction, TEvent As ITradeEvent(Of TAction)) Implements IExecutor(Of TState, TAction, TEvent)
