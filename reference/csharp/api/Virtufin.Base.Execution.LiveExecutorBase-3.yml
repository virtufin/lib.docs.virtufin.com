  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Subclass hook: route the action to the exchange and emit the

    resulting event.
  remarks: >-
    Production subclasses will marshal the action to a wire protocol

    (REST, FIX, gRPC, native API), <code>await</code> the exchange's response,

    and translate it to a <code class="typeparamref">TEvent</code>. In development

    subclasses may choose to no-op, log, or delegate to a local

    simulation — the base does not constrain this.
  example: []
  syntax:
    content: protected abstract Task<(TState NextState, TEvent Event)> ProcessAsync(TState state, TAction action)
    parameters:
    - id: state
      type: '{TState}'
      description: Current executor state.
    - id: action
      type: '{TAction}'
      description: The trade action to route.
    return:
      type: System.Threading.Tasks.Task{System.ValueTuple{{TState},{TEvent}}}
      description: Tuple of (next state, outcome event).
    content.vb: Protected MustOverride Function ProcessAsync(state As TState, action As TAction) As Task(Of (NextState As TState, [Event] As TEvent))
