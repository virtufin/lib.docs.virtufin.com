  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Executor base that models bid-ask slippage. Subclasses define the slippage

    distribution (no distribution assumed by the base) and how the slippage

    value is applied to the case-by-case fill logic.
  remarks: >-
    Template method pattern. The base owns the Execute flow:

    it calls <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.CalculateSlippage(%600%2c%601)" data-throw-if-not-resolved="false"></xref> to obtain a (next-state, slippage)

    pair, then passes both to <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.Process(%600%2c%601%2cSystem.Double)" data-throw-if-not-resolved="false"></xref>. Subclasses define both

    hooks — the slippage distribution (Gaussian, uniform, log-normal, constant,

    etc.) and the case-by-case fill logic that consumes the slippage value.
  example: []
  syntax:
    content: 'public abstract class SlippageExecutorBase<TState, TAction, TEvent> : IExecutor<TState, TAction, TEvent> where TState : IExecutionState where TAction : ITradeAction where TEvent : ITradeEvent<TAction, DateTimeOffset>'
    typeParameters:
