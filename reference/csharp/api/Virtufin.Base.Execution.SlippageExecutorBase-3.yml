    path: ../../../src/Virtufin.Base/Execution/Executors.cs
    startLine: 156
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Subclass hook: given the (state after <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.CalculateSlippage(%600%2c%601)" data-throw-if-not-resolved="false"></xref>),

    the action, and the slippage value, produce the next state and the

    outcome event.
  remarks: >-
    Implementations typically apply the slippage to fill actions (buy/sell)

    and emit the appropriate <code class="typeparamref">TEvent</code> subtype. The

    base imposes no assumption about how the slippage is applied — the

    subclass owns the formula.
  example: []
  syntax:
    content: protected abstract (TState NextState, TEvent Event) Process(TState state, TAction action, double slippage)
    parameters:
    - id: state
      type: '{TState}'
      description: The state returned by <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.CalculateSlippage(%600%2c%601)" data-throw-if-not-resolved="false"></xref>.
    - id: action
      type: '{TAction}'
      description: The trade action to process.
    - id: slippage
      type: System.Double
      description: The slippage value from <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.CalculateSlippage(%600%2c%601)" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.ValueTuple{{TState},{TEvent}}
      description: Tuple of (next state, outcome event).
    content.vb: Protected MustOverride Function Process(state As TState, action As TAction, slippage As Double) As (NextState As TState, [Event] As TEvent)
