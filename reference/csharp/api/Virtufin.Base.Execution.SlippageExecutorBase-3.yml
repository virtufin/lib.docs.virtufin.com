    startLine: 138
  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.Execution
  summary: >-
    Subclass hook: advance state (e.g. step a PRNG) and return the slippage

    value for this action. The base imposes no distribution — subclasses

    choose.
  remarks: >-
    The returned state is forwarded to <xref href="Virtufin.Base.Execution.SlippageExecutorBase%603.Process(%600%2c%601%2cSystem.Double)" data-throw-if-not-resolved="false"></xref>; the slippage

    is also passed in. This means a subclass can advance the PRNG (or

    similar state evolution) here without re-implementing the

    Execute flow.
  example: []
  syntax:
    content: protected abstract (TState NextState, double Slippage) CalculateSlippage(TState state, TAction action)
    parameters:
    - id: state
      type: '{TState}'
      description: Current executor state.
    - id: action
      type: '{TAction}'
      description: The trade action whose slippage is being computed.
    return:
      type: System.ValueTuple{{TState},System.Double}
      description: >-
        Tuple of (next state, slippage). The slippage value's unit and

        interpretation are subclass-defined (e.g. basis points, fraction,

        absolute offset).
    content.vb: Protected MustOverride Function CalculateSlippage(state As TState, action As TAction) As (NextState As TState, Slippage As Double)
