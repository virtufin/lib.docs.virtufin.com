  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.OrderBooks
  summary: >-
    Apply one level mutation: a zero size removes the price, otherwise the

    size is assigned (absolute, not incremental).
  example: []
  syntax:
    content: void ApplyLevel(bool isBid, L price, A size)
    parameters:
    - id: isBid
      type: System.Boolean
      description: <code>true</code> for the bid side, <code>false</code> for asks.
    - id: price
      type: '{L}'
      description: Level price.
    - id: size
      type: '{A}'
      description: New aggregate size; zero removes the level.
    content.vb: Sub ApplyLevel(isBid As Boolean, price As L, size As A)
