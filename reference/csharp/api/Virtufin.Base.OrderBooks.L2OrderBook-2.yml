  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.OrderBooks
  summary: >-
    In-memory Level-2 order book: two sorted ladders of aggregate size keyed by

    price. Pure state — no I/O, no CloudEvents, not thread-safe.
  remarks: >-
    <p>

    The price (level) and size (depth) dimensions carry independent fixed

    scales supplied at construction. Every value written must already be at the

    corresponding scale; the sorted comparer compares price amounts via

    <xref href="Virtufin.Core.Position.IAmount.CompareTo(Virtufin.Core.Position.IAmount)" data-throw-if-not-resolved="false"></xref>, which throws

    <xref href="Virtufin.Core.Position.PrecisionMismatchException" data-throw-if-not-resolved="false"></xref> on a stray mismatch, so a

    mis-normalized producer fails loudly rather than corrupting the ladder.

    </p>

    <p>

    Bids are enumerated highest price first, asks lowest price first. Live

    projections (<xref href="Virtufin.Base.OrderBooks.L2OrderBook%602.BidsDescending" data-throw-if-not-resolved="false"></xref>/<xref href="Virtufin.Base.OrderBooks.L2OrderBook%602.AsksAscending" data-throw-if-not-resolved="false"></xref>) are

    snapshots and cannot tear mid-update.

    </p>
  example: []
  syntax:
    content: 'public sealed class L2OrderBook<A, L> : IL2OrderBook<A, L>, IOrderBook, IL2OrderBookWriter<A, L> where A : IFixedPointAmount where L : IFixedPointAmount'
    typeParameters:
    - id: A
      description: Depth (size) amount type.
    - id: L
      description: Level (price) amount type.
    content.vb: Public NotInheritable Class L2OrderBook(Of A As IFixedPointAmount, L As IFixedPointAmount) Implements IL2OrderBook(Of A, L), IOrderBook, IL2OrderBookWriter(Of A, L)
