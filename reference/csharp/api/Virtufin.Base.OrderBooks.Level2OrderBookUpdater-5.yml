  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base.OrderBooks
  summary: >-
    Applies Level-2 snapshots and diffs to an <xref href="Virtufin.Base.OrderBooks.L2OrderBook%602" data-throw-if-not-resolved="false"></xref>

    using the standard local-order-book-maintenance algorithm: bootstrap from a

    snapshot, then apply diffs whose first update id brackets the book's

    previous last update id. A zero size removes a level.
  remarks: >-
    <p>

    The single bracket check (<code>FirstUpdateId &gt; LastUpdateId + 1</code>) is

    applied uniformly to every diff, not just the first after a snapshot; after

    a successful apply the book's <xref href="Virtufin.Base.OrderBooks.IL2OrderBookWriter%602.LastUpdateId" data-throw-if-not-resolved="false"></xref>

    becomes that diff's final id, so the next diff's first id must equal

    <code>LastUpdateId + 1</code> to pass the same check.

    </p>

    <p>

    An exact replay of the most recently applied diff (same first and final id)

    re-applies its levels and reports <xref href="Virtufin.Core.Position.OrderBookUpdateStatus.Applied" data-throw-if-not-resolved="false"></xref>

    rather than <xref href="Virtufin.Core.Position.OrderBookUpdateStatus.Stale" data-throw-if-not-resolved="false"></xref>. Delivery is

    at-least-once and callers persist after applying, so without this a retried

    diff would be dismissed as stale and the update silently lost.

    Re-application is safe because a level is an absolute assignment and it also

    repairs a partial apply from a failed attempt.

    </p>

    <p>

    Stateless: per-book replay and lifecycle state live on the book, so one

    updater instance can serve many books. The updater is not thread-safe; the

    caller owns serialisation per book.

    </p>
  example: []
  syntax:
    content: 'public sealed class Level2OrderBookUpdater<TBook, A, L, S, D> : IOrderBookUpdater<TBook, S, D> where TBook : IL2OrderBook<A, L>, IL2OrderBookWriter<A, L> where A : IFixedPointAmount where L : IFixedPointAmount where S : IL2OrderBookSnapshot<A, L> where D : IL2OrderBookDiff<A, L>'
    typeParameters:
    - id: TBook
      description: Concrete book type.
    - id: A
      description: Depth (size) amount type.
    - id: L
      description: Level (price) amount type.
    - id: S
      description: Snapshot data type.
    - id: D
      description: Diff data type.
