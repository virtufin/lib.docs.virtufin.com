  namespace: Virtufin.Base
  summary: 'A holding: an amount of some <xref href="Virtufin.Base.Position%601.AssetIdentifier" data-throw-if-not-resolved="false"></xref>.'
  remarks: >-
    The size carries its own precision, and precision is part of an amount's identity, so

    two positions in the same asset recorded at different precisions are not equal. Equality

    returns <code>false</code> for that rather than throwing, which is what lets a position sit in

    a dictionary or be compared by the generated equality of a record that holds one.
  example: []
  syntax:
    content: 'public readonly record struct Position<A> : IEquatable<Position<A>> where A : IFixedPointAmount<A>'
    typeParameters:
    - id: A
      description: >-
        The fixed-point amount type measuring the holding — <xref href="Virtufin.Core.Position.DecimalAmount" data-throw-if-not-resolved="false"></xref> for

        decimal instruments, <xref href="Virtufin.Core.Position.BinaryAmount" data-throw-if-not-resolved="false"></xref> where a binary scale is the natural one.
    content.vb: Public Structure Position(Of A As IFixedPointAmount(Of A)) Implements IEquatable(Of Position(Of A))
