  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    A contract that transfers a <xref href="Virtufin.Base.Position%601" data-throw-if-not-resolved="false"></xref> from one

    <xref href="Virtufin.Base.Signatory" data-throw-if-not-resolved="false"></xref> to another at a fixed <xref href="Virtufin.Base.TimeStamp" data-throw-if-not-resolved="false"></xref>

    (its maturity).
  remarks: >-
    <xref href="Virtufin.Core.Contracts.IContract" data-throw-if-not-resolved="false"></xref> and <xref href="Virtufin.Core.Contracts.IWithMaturity" data-throw-if-not-resolved="false"></xref> are non-generic, so a contract

    registry or history holding <xref href="Virtufin.Core.Contracts.IContract" data-throw-if-not-resolved="false"></xref> is unaffected by the type parameter.
  example:
  - >-
    <pre><code class="lang-csharp">var from = Signatory.New();

    var to = Signatory.New();

    var pos = Position.Of(100, CurrencyIdentifier.USD);

    var at = TimeStamp.New(2024, 12, 31);

    var id = ContractIdentifier.NewWithUuid();

    var contract = new PositionTransferContract&lt;DecimalAmount&gt;(pos, from, to, at, id);</code></pre>
  syntax:
    content: 'public sealed record PositionTransferContract<A> : IWithMaturity, IContract, IEquatable<IContract>, IEquatable<PositionTransferContract<A>> where A : IFixedPointAmount<A>'
    typeParameters:
    - id: A
      description: The fixed-point amount type measuring the position.
    content.vb: Public NotInheritable Class PositionTransferContract(Of A As IFixedPointAmount(Of A)) Implements IWithMaturity, IContract, IEquatable(Of IContract), IEquatable(Of PositionTransferContract(Of A))
