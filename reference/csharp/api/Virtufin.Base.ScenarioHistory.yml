  assemblies:
  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    Concrete <xref href="Virtufin.Core.Contracts.IScenarioHistory" data-throw-if-not-resolved="false"></xref> backed by an in-memory list of

    scenarios. New scenarios are emitted through a hot

    <xref href="System.Reactive.Subjects.Subject%601" data-throw-if-not-resolved="false"></xref> with no replay buffer — late subscribers see only

    future emissions.
  example:
  - >-
    <pre><code class="lang-csharp">var history = new ScenarioHistory();

    history.Append(new Scenario(TimeStamp.New(2024,1,1), State.Empty));

    using var sub = history.NewScenarios.Subscribe(s =&gt; Console.WriteLine(s.TimeStamp));

    history.Append(new Scenario(TimeStamp.New(2024,1,2), State.Empty)); // printed</code></pre>
  syntax:
    content: 'public sealed class ScenarioHistory : IScenarioHistory, IEnumerable<IScenario>, IEnumerable, IDisposable'
