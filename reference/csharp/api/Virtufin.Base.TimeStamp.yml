  - Virtufin.Base
  namespace: Virtufin.Base
  summary: >-
    Calendar-date-backed <xref href="Virtufin.Core.Identifiers.ITimeStamp" data-throw-if-not-resolved="false"></xref>. Time-of-day is intentionally

    discarded; financial contracts settle on calendar dates.
  example:
  - >-
    <pre><code class="lang-csharp">var t = TimeStamp.New(2024, 6, 1);

    Console.WriteLine(t);           // 2024-06-01

    var later = t.AdvanceDays(7);   // 2024-06-08</code></pre>
