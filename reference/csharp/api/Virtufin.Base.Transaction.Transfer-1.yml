  summary: Transfer a position between two parties, authorised by a contract.
  remarks: >-
    Only this leaf record carries the amount type. <xref href="Virtufin.Base.Transaction" data-throw-if-not-resolved="false"></xref> itself stays

    non-generic, so <code>State</code>, <code>Message</code> and <code>IScenarioHistory</code> keep holding

    plain <xref href="Virtufin.Base.Transaction" data-throw-if-not-resolved="false"></xref> and are unaffected.
  example: []
  syntax:
    content: 'public sealed record Transaction.Transfer<A> : Transaction, ITransaction, IEquatable<ITransaction>, IEquatable<Transaction>, IEquatable<Transaction.Transfer<A>> where A : IFixedPointAmount<A>'
