  summary: >-
    Concrete <xref href="Virtufin.Core.Contracts.ITransaction" data-throw-if-not-resolved="false"></xref> for the financial contract model. Three

    cases are supported:


    <ul><li><xref href="Virtufin.Base.Transaction.CreateContract" data-throw-if-not-resolved="false"></xref>: create a new contract with the given parameters.</li><li><xref href="Virtufin.Base.Transaction.CancelContract" data-throw-if-not-resolved="false"></xref>: terminate the named contract.</li><li><xref href="Virtufin.Base.Transaction.AtomicTransactions" data-throw-if-not-resolved="false"></xref>: an atomic group of transactions; not tied to a single contract.</li></ul>
  example: []
