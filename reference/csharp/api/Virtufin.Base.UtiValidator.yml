  summary: Validates ISDA Universal Transaction Identifier (UTI) payloads.
  remarks: >-
    Format rules (from the ISDA UTI guidance):


    <ul><li>Length between 1 and 52 characters.</li><li>Characters: alphanumeric or one of <code>-_=:</code>.</li><li>Non-empty.</li></ul>
