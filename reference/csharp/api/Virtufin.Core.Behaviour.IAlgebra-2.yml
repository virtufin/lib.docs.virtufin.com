  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Behaviour
  summary: >-
    An F-algebra over an event log. Given a current state and an event,

    produce the next state. Combined with the initial state and an event log,

    the algebra defines a derived signal via the fold (or scan for running

    computation).
  example:
  - >-
    <pre><code class="lang-csharp">public sealed record PositionState(Symbol Symbol, Amount Qty, Price AvgEntry, DateTimeOffset EventTime)

    {
        public PositionState Apply(IPositionEvent evt) =&gt; evt switch
        {
            PositionEvent.Opened o =&gt; new PositionState(o.Symbol, o.Qty, o.Price, o.EventTime),
            PositionEvent.Updated u =&gt; new PositionState(...),
            _ =&gt; this,
        };
    }</code></pre>
  syntax:
    content: 'public interface IAlgebra<TEvent, TState> where TEvent : notnull'
    typeParameters:
    - id: TEvent
      description: The event type consumed.
    - id: TState
      description: The state type produced.
    content.vb: Public Interface IAlgebra(Of TEvent, TState)
