- uid: Virtufin.Core.Behaviour.IDecide`4
  commentId: T:Virtufin.Core.Behaviour.IDecide`4
  id: IDecide`4
  parent: Virtufin.Core.Behaviour
  children: []
  langs:
  - csharp
  - vb
  name: IDecide<TState, TMarket, TPortfolio, TAction>
  nameWithType: IDecide<TState, TMarket, TPortfolio, TAction>
  fullName: Virtufin.Core.Behaviour.IDecide<TState, TMarket, TPortfolio, TAction>
  type: Interface
  source:
    remote:
      path: src/Virtufin.Core/Behaviour/IDecide.cs
      branch: master
      repo: https://gitea.haenerconsulting.com/virtufin/virtufin-dotnet
    id: IDecide
    path: ../../../src/Virtufin.Core/Behaviour/IDecide.cs
    startLine: 33
  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Behaviour
  summary: >-
    The <code>decide</code> morphism of the trading loop: given the strategy's

    hidden state, a market observation, and the folded portfolio state,

    produce the next strategy state and zero or more trade actions. This

    is the coalgebra

    <code>StrategyState × MarketEvent × PortfolioState → StrategyState ×

    TradeAction[]</code> of the domain spec (§6.4), exposed as an

    <xref href="Virtufin.Core.Behaviour.IProcess%603" data-throw-if-not-resolved="false"></xref> so strategies compose

    with the generic <code>scan</code>/<code>fold</code> drivers

    (<xref href="Virtufin.Core.Behaviour.ProcessExtensions" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: 'public interface IDecide<TState, TMarket, TPortfolio, TAction> : IProcess<TState, (TMarket, TPortfolio), TAction[]> where TState : IStrategyState where TMarket : IMarketEvent where TPortfolio : IPortfolioState where TAction : ITradeAction'
    typeParameters:
    - id: TState
      description: The strategy's internal state.
    - id: TMarket
      description: The market event type observed.
    - id: TPortfolio
      description: The portfolio state type observed.
    - id: TAction
      description: >-
        The trade action type emitted; the step
            output is an array of <code class="typeparamref">TAction</code> because a single
            observation may yield zero or more intents.
    content.vb: Public Interface IDecide(Of TState As IStrategyState, TMarket As IMarketEvent, TPortfolio As IPortfolioState, TAction As ITradeAction) Inherits IProcess(Of TState, (TMarket, TPortfolio), TAction())
