  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Behaviour
  summary: >-
    An immutable, self-folding indicator: consumes samples one at a time and

    exposes its current value via <xref href="Virtufin.Core.Behaviour.ISignal%601" data-throw-if-not-resolved="false"></xref>. Composes with

    <xref href="Virtufin.Core.Behaviour.ISignal%601" data-throw-if-not-resolved="false"></xref> rather than <xref href="Virtufin.Core.Behaviour.IAlgebra%602" data-throw-if-not-resolved="false"></xref> or

    IProcess&lt;S,E&gt; because the indicator's own state doesn't need

    to be threaded as an explicit external parameter — <code>this</code> already is

    the state.
  example: []
  syntax:
    content: 'public interface IIndicator<TSelf, TSample, TValue> : ISignal<TValue> where TSelf : IIndicator<TSelf, TSample, TValue>'
    typeParameters:
    - id: TSelf
      description: >-
        The concrete indicator type, so <xref href="Virtufin.Core.Behaviour.IIndicator%603.Add(%601)" data-throw-if-not-resolved="false"></xref> returns
            the same concrete type rather than the interface.
    - id: TSample
      description: The sample type consumed on each observation.
    - id: TValue
      description: The indicator's current value type.
    content.vb: Public Interface IIndicator(Of TSelf As IIndicator(Of TSelf, TSample, TValue), TSample, TValue) Inherits ISignal(Of TValue)
