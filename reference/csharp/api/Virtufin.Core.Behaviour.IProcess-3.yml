  namespace: Virtufin.Core.Behaviour
  summary: >-
    Coalgebra shape for a stateful process: given the current state and an

    input observation, produce the next state and an output. Used to model

    <code>decide</code> (strategy) and <code>execute</code> (execution engine) where the

    process carries hidden state that must be exposed explicitly.
  example: []
  syntax:
    content: public interface IProcess<TState, TInput, TOutput>
    typeParameters:
    - id: TState
      description: The process's internal state.
    - id: TInput
      description: The input observation.
    - id: TOutput
      description: The output emitted at this step.
    content.vb: Public Interface IProcess(Of TState, TInput, TOutput)
