  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Behaviour
  summary: >-
    Coalgebra shape for a stateful process: given the current state and an

    input observation, produce the next state and an output. The domain

    instantiations are <xref href="Virtufin.Core.Behaviour.IDecide%604" data-throw-if-not-resolved="false"></xref>

    (<code>decide</code>) and <code>IExecutor</code> (<code>execute</code>), where the process

    carries hidden state that must be exposed explicitly. Drive a process

    over an observable stream of inputs with

    <xref href="Virtufin.Core.Behaviour.ProcessExtensions.Run%60%603(Virtufin.Core.Behaviour.IProcess%7b%60%600%2c%60%601%2c%60%602%7d%2cSystem.IObservable%7b%60%601%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public interface IProcess<TState, TInput, TOutput>
    typeParameters:
    - id: TState
      description: The process's internal state.
    - id: TInput
      description: The input observation.
    - id: TOutput
      description: The output emitted at this step.
    content.vb: Public Interface IProcess(Of TState, TInput, TOutput)
