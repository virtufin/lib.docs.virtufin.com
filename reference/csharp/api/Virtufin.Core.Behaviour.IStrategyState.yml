  summary: >-
    Marker for any type that carries the hidden state of a strategy:

    indicator values, model weights, momentum windows, cooldown timers.

    Counterpart of <xref href="Virtufin.Core.Execution.IExecutionState" data-throw-if-not-resolved="false"></xref> on the executor

    side — it exists so <xref href="Virtufin.Core.Behaviour.IDecide%604" data-throw-if-not-resolved="false"></xref>

    can constrain its state parameter.
