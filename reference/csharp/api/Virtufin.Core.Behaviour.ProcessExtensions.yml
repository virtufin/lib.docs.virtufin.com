  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Behaviour
  summary: >-
    Run the process over a stream of inputs, starting from an explicit

    initial state (e.g. a checkpoint from a previous run). Emits the

    pair of evolved state and output for every input, in order. The

    state is fresh per subscription — resubscribing restarts from

    <code class="paramref">initialState</code>.
  example: []
  syntax:
    content: public static IObservable<(TState State, TOutput Output)> Run<TState, TInput, TOutput>(this IProcess<TState, TInput, TOutput> process, IObservable<TInput> inputs, TState initialState)
    parameters:
    - id: process
      type: Virtufin.Core.Behaviour.IProcess{{TState},{TInput},{TOutput}}
      description: The coalgebra to drive.
    - id: inputs
      type: System.IObservable{{TInput}}
      description: Cold stream of input observations.
    - id: initialState
      type: '{TState}'
      description: State to start folding from.
    typeParameters:
    - id: TState
      description: The process's internal state.
    - id: TInput
      description: The input observation.
    - id: TOutput
      description: The output emitted at each step.
    return:
      type: System.IObservable{System.ValueTuple{{TState},{TOutput}}}
      description: Stream of (state, output) pairs, one per input.
    content.vb: Public Shared Function Run(Of TState, TInput, TOutput)(process As IProcess(Of TState, TInput, TOutput), inputs As IObservable(Of TInput), initialState As TState) As IObservable(Of (State As TState, Output As TOutput))
  overload: Virtufin.Core.Behaviour.ProcessExtensions.Run*
