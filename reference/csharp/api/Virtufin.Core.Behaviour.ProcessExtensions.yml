  summary: >-
    Drivers that fold an <xref href="Virtufin.Core.Behaviour.IProcess%603" data-throw-if-not-resolved="false"></xref>

    coalgebra over a stream of inputs. The coalgebra itself stays pure and

    pull-based; these extensions add the reactive layer on demand — the

    <code>scan</code> combinator of the domain spec (§10.4).
