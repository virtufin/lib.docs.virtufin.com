  fullName.vb: Virtufin.Core.Behaviour.ProcessExtensions.Run(Of TState, TInput, TOutput)(Virtufin.Core.Behaviour.IProcess(Of TState, TInput, TOutput), System.IObservable(Of TInput), TState)
  name.vb: Run(Of TState, TInput, TOutput)(IProcess(Of TState, TInput, TOutput), IObservable(Of TInput), TState)
