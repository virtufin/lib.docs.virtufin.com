    id: IClock
    path: ../../../src/Virtufin.Core/Clock/IClock.cs
    startLine: 24
  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Clock
  summary: >-
    A clock is a stream of time values emitted as events. Each emission is

    a <code class="typeparamref">T</code> (typically <code>DateTimeOffset</code>) representing

    a point in time. Subscribers receive emissions via

    <xref href="System.IObservable%601.Subscribe(System.IObserver%7b%600%7d)" data-throw-if-not-resolved="false"></xref>; callers should NOT

    poll the clock for a "current value".
  remarks: >-
    A clock is NOT a "now" provider — that abstraction is replaced by the

    observable stream. Concrete implementations include

    <xref href="Virtufin.Core.Clock.Metronome%601" data-throw-if-not-resolved="false"></xref> (regular periodic emission) and

    Virtufin.Base.Clock.DateTimeWallClock (specialised for

    <code>DateTimeOffset</code>). For "induced by actions" scenarios (e.g.

    backtest replay), the test driver emits via a

    <xref href="System.Reactive.Subjects.Subject%601" data-throw-if-not-resolved="false"></xref> cast to

    <code>IClock&lt;T&gt;</code>.
  example: []
  syntax:
    content: 'public interface IClock<T> : IObservable<T> where T : struct, IComparable<T>'
    typeParameters:
    - id: T
      description: >-
        The time representation emitted by the clock. Must be a struct so the

        implementation can use value-type semantics, and must implement

        <xref href="System.IComparable%601" data-throw-if-not-resolved="false"></xref> so consumers can order the emissions.
    content.vb: Public Interface IClock(Of T As {Structure, IComparable(Of T)}) Inherits IObservable(Of T)
