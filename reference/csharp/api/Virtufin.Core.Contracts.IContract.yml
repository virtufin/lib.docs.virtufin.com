  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Contracts
  summary: >-
    Validates the supplied messages against the contract and the prior

    scenario history, returning the subset of transactions deemed valid.

    Returns <code>null</code> when the input is invalid for this contract at the

    current time.
  example: []
  syntax:
    content: IEnumerable<ITransaction>? VerifyMessages(IEnumerable<IMessage> messages, IScenarioHistory scenarioHistory)
