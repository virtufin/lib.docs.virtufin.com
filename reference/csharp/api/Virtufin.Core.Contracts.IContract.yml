  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Contracts
  summary: >-
    A financial contract: an agreement that, given a sequence of messages

    arriving at particular time-points, produces a sequence of valid

    transactions. Implementations decide which messages they accept via

    <xref href="Virtufin.Core.Contracts.IContract.VerifyMessages(System.Collections.Generic.IEnumerable%7bVirtufin.Core.Contracts.IMessage%7d%2cVirtufin.Core.Contracts.IScenarioHistory)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The default <xref href="Virtufin.Core.Contracts.IContract.IsRelatedMessage(Virtufin.Core.Contracts.IMessage)" data-throw-if-not-resolved="false"></xref> simply delegates to

    <xref href="Virtufin.Core.Contracts.IContract.IsRelatedTransaction(Virtufin.Core.Contracts.ITransaction)" data-throw-if-not-resolved="false"></xref>; override only if a richer match is

    needed.
