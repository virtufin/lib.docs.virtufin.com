  summary: >-
    Marker for any opaque, equality-comparable bundle of inputs required to

    build a contract. The concrete payload is implementation-specific; in the

    canonical case it wraps a Virtufin.Data.Variant so the same

    data can be serialised through FlatBuffers or MessagePack.
