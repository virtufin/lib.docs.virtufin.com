  summary: >-
    A signed wrapper around a <xref href="Virtufin.Core.Contracts.IMessage.Transaction" data-throw-if-not-resolved="false"></xref>: a transaction plus the

    <xref href="Virtufin.Core.Contracts.IMessage.Sender" data-throw-if-not-resolved="false"></xref> that authorised it. Contracts use messages to filter

    the work they perform on a given time-point via

    <xref href="Virtufin.Core.Predicates.IMessageSelectorPredicate" data-throw-if-not-resolved="false"></xref>.
