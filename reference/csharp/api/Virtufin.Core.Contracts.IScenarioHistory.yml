    id: IScenarioHistory
    path: ../../../src/Virtufin.Core/Contracts/IScenarioHistory.cs
    startLine: 16
  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Contracts
  summary: >-
    An append-only sequence of <xref href="Virtufin.Core.Contracts.IScenario" data-throw-if-not-resolved="false"></xref> snapshots. Provides

    pull-based lookup (<xref href="Virtufin.Core.Contracts.IScenarioHistory.Scenario(Virtufin.Core.Identifiers.ITimeStamp)" data-throw-if-not-resolved="false"></xref>) and a push-based observable

    (<xref href="Virtufin.Core.Contracts.IScenarioHistory.NewScenarios" data-throw-if-not-resolved="false"></xref>) for late subscribers — the latter is a hot

    <code>Subject&lt;IScenario&gt;</code> with no replay buffer.
  remarks: >-
    The hot, no-replay choice means consumers that subscribe after history has

    been appended will not receive past scenarios — they only see future

    emissions, matching the semantics of the existing

    <code>NatsObservable</code> in <code>Virtufin.Data</code>.
  example: []
  syntax:
    content: 'public interface IScenarioHistory : IEnumerable<IScenario>, IEnumerable'
    content.vb: Public Interface IScenarioHistory Inherits IEnumerable(Of IScenario), IEnumerable
  derivedClasses:
  - Virtufin.Base.ScenarioHistory
  inheritedMembers:
