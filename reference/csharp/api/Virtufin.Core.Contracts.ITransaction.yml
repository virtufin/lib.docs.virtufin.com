  summary: >-
    A unit of business activity: a creation, cancellation, transfer, or any

    other operation that may be applied to a contract. Transactions carry an

    optional pointer to the contract they affect; for composite transactions

    (e.g. an atomic set of operations) the pointer is <code>null</code>.
  example:
  - >-
    <pre><code class="lang-csharp">public sealed record CreateContract(ContractIdentifier Id, ContractParameters Parameters) : ITransaction

    {
        public IContractIdentifier? RelatedContract =&gt; Id;
    }</code></pre>
