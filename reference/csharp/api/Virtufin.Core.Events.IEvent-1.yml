  summary: >-
    Marker for any value that participates in the Virtufin event flow. Events

    are immutable facts; they are appended to logs, transported on Dapr topics,

    and folded into state by algebræ. Implementations should be records so

    they have value equality.
  example: []
  syntax:
    content: 'public interface IEvent<T> : IEquatable<IEvent<T>> where T : IComparable<T>'
    typeParameters:
    - id: T
      description: >-
        The event's own time type (e.g. <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> for
            real-time domain events, or an open type parameter for indicator samples whose time
            axis is caller-defined).
    content.vb: Public Interface IEvent(Of T As IComparable(Of T)) Inherits IEquatable(Of IEvent(Of T))
