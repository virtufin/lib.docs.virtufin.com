    startLine: 14
  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Events
  summary: >-
    The transport envelope carried alongside every event. Combines the routing

    context (<xref href="Virtufin.Core.Events.IEventEnvelope.ScenarioId" data-throw-if-not-resolved="false"></xref>, <xref href="Virtufin.Core.Events.Lane" data-throw-if-not-resolved="false"></xref> triplet), the clock

    interpretation (<xref href="Virtufin.Core.Events.IEventEnvelope.ClockType" data-throw-if-not-resolved="false"></xref>, <xref href="Virtufin.Core.Events.IEventEnvelope.EventTime" data-throw-if-not-resolved="false"></xref>),

    audit/processing metadata (<xref href="Virtufin.Core.Events.IEventEnvelope.WallTime" data-throw-if-not-resolved="false"></xref>, <xref href="Virtufin.Core.Events.IEventEnvelope.CorrelationId" data-throw-if-not-resolved="false"></xref>,

    <xref href="Virtufin.Core.Events.IEventEnvelope.RunId" data-throw-if-not-resolved="false"></xref>), and a human-readable <xref href="Virtufin.Core.Events.IEventEnvelope.ScenarioName" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <xref href="Virtufin.Core.Events.IEventEnvelope.EventTime" data-throw-if-not-resolved="false"></xref> lives in the business domain clock (wall time for

    <code>act</code> scenarios, synthetic time for <code>hyp</code>); <xref href="Virtufin.Core.Events.IEventEnvelope.WallTime" data-throw-if-not-resolved="false"></xref>

    is always real wall-clock time used only for audit and latency tracking.
