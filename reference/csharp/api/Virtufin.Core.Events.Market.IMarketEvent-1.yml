  namespace: Virtufin.Core.Events.Market
  summary: >-
    Marker for any market observation — exogenous price or order-book state

    from the data feed, or a derived signal. Behaviour-level market events

    are only <code>TickReceived</code> and <code>OrderBookReceived</code>; candles,

    VWAP, and other derived signals are carried by <code>RichMarketEvent</code>,

    which also implements this interface.
  example: []
  syntax:
    content: 'public interface IMarketEvent<T> : IEvent<T>, IEquatable<IEvent<T>> where T : IComparable<T>'
