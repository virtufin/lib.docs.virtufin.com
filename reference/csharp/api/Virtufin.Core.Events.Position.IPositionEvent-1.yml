  namespace: Virtufin.Core.Events.Position
  summary: >-
    Marker for any event that changes a holding. Position events flow through

    the unified <code>sc.{scenarioId}.position.*</code> topic family and include

    holdings lifecycle changes only (open/update/close/flip). Exposure breaches

    are reported separately under <code>Risk</code>.
  example: []
  syntax:
    content: 'public interface IPositionEvent<T> : IEvent<T>, IEquatable<IEvent<T>> where T : IComparable<T>'
