  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Events
  summary: >-
    A single observation at a point in time, generic over both the time axis

    and the value type. This is the sample shape <code>IIndicator</code>

    implementations consume — kept in <code>Virtufin.Core.Events</code> rather than

    <code>Virtufin.Core.Behaviour</code> because it's a general timestamped-event

    shape, not indicator-specific.
  example: []
  syntax:
    content: 'public sealed record TimestampedSample<TTime, TValue> : IEvent<TTime>, IEquatable<IEvent<TTime>>, IEquatable<TimestampedSample<TTime, TValue>> where TTime : IComparable<TTime>'
    typeParameters:
    - id: TTime
      description: >-
        The time type (e.g. <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> for real
            candles, or a synthetic tick counter for deterministic replay).
    - id: TValue
      description: The observed value's type.
