  namespace: Virtufin.Core.Events.Trade
  summary: >-
    Trade event parameterised by the action type that produced it. Used by

    <code>IExecutor&lt;S, A, E&gt;</code> with the constraint <code>E : ITradeEvent&lt;A&gt;</code>

    to enforce that an executor producing events for <code class="typeparamref">A</code>

    can only emit events in the <code>TradeEvent&lt;A&gt;</code> hierarchy.
  example: []
  syntax:
    content: 'public interface ITradeEvent<out A, T> : IEvent<T>, IEquatable<IEvent<T>> where A : ITradeAction where T : IComparable<T>'
    typeParameters:
    - id: A
      description: The trade action type this event is parameterised by.
    - id: T
      description: The event's own time type.
    content.vb: Public Interface ITradeEvent(Of Out A As ITradeAction, T As IComparable(Of T)) Inherits IEvent(Of T), IEquatable(Of IEvent(Of T))
