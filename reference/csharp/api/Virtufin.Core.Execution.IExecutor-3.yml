  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Execution
  summary: >-
    Signature of an execution engine: given the current

    <code class="typeparamref">TState</code> and a <code class="typeparamref">TAction</code>,

    produce the next state and an <code class="typeparamref">TEvent</code> describing

    the outcome. The event type is constrained to be parameterised by the

    action type so the executor statically cannot emit events for the wrong

    action universe.
  remarks: >-
    This is the Kleisli morphism <code>A → IO E</code> from the domain spec, with

    the executor state exposed explicitly and <code>Task</code> as the concrete

    <code>IO</code>. A deterministic/backtest executor is the degenerate case

    that never actually suspends (its own hook stays synchronous internally

    and wraps the result in a completed <code>Task</code>); a live executor

    genuinely awaits the venue's response inside its own hook. Both satisfy

    the same signature -- callers never need to know which they're driving.
  example: []
  syntax:
    content: 'public interface IExecutor<TState, TAction, TEvent> where TState : IExecutionState where TAction : ITradeAction where TEvent : ITradeEvent<TAction>'
    typeParameters:
    - id: TState
      description: Execution state type.
    - id: TAction
      description: Trade action type the executor consumes.
    - id: TEvent
      description: Trade event type parameterised by <code class="typeparamref">TAction</code>.
    content.vb: Public Interface IExecutor(Of TState As IExecutionState, TAction As ITradeAction, TEvent As ITradeEvent(Of TAction))
