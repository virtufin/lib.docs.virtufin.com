  summary: >-
    As C# doesn't support dependent types, we cannot define a class which is given by generic constraints to the values of the entities, attributes and values in terms of

    some (value) depedent type at compile time. We have to check the test if a entity/attribute/value triplet belongs to a particular class to runtime via a  type membbrship predicate, <xref href="Virtufin.Core.IEntityAttributeValueTypeSpecifier.IsTypeMember%60%601(Virtufin.Core.IEntityIdentifier%2cVirtufin.Core.IAttribute%7b%60%600%7d%2c%60%600)" data-throw-if-not-resolved="false"></xref> instead
