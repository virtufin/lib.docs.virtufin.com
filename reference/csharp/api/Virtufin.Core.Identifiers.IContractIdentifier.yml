  namespace: Virtufin.Core.Identifiers
  summary: >-
    Marker for any value that uniquely identifies a contract (e.g. a UUID, an

    ISDA UTI, or an opaque string). Implementations must be equality-comparable

    so transactions and contracts can be matched by identifier.
  remarks: >-
    Distinct from <xref href="Virtufin.Core.IEntityIdentifier" data-throw-if-not-resolved="false"></xref> which marks identifiers for

    entities (the things contracts operate on).
