  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Identifiers
  summary: >-
    Marker for any value that represents a point in time. Implementations must

    be totally orderable and equality-comparable so they can drive time-based

    selection (<xref href="Virtufin.Core.Predicates.IMessageSelectorPredicate" data-throw-if-not-resolved="false"></xref>,

    <xref href="Virtufin.Core.Contracts.IScenarioHistory.Scenario(Virtufin.Core.Identifiers.ITimeStamp)" data-throw-if-not-resolved="false"></xref>, etc.).
  remarks: >-
    The canonical concrete implementation is the <xref href="System.DateOnly" data-throw-if-not-resolved="false"></xref>-backed

    record in <code>Virtufin.Base</code>.
  example: []
  syntax:
    content: 'public interface ITimeStamp : IComparable<ITimeStamp>, IEquatable<ITimeStamp>'
    content.vb: Public Interface ITimeStamp Inherits IComparable(Of ITimeStamp), IEquatable(Of ITimeStamp)
