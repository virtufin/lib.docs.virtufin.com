  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    Fixed-point amount with base 2 (binary scaling), stored as a whole part, a

    fractional part, and a precision (number of binary fraction digits). The

    represented value is <code>Whole + Fraction / 2^N</code>.
  remarks: >-
    Exists alongside <xref href="Virtufin.Core.Position.DecimalAmount" data-throw-if-not-resolved="false"></xref> to exercise and prove the

    base-agnosticism of <xref href="Virtufin.Core.Position.IFixedPointAmount" data-throw-if-not-resolved="false"></xref> and

    <xref href="Virtufin.Core.Position.FixedPointArithmetic" data-throw-if-not-resolved="false"></xref>. Arithmetic follows the same rules:

    addition/subtraction require a common base and precision and throw

    <xref href="Virtufin.Core.Position.PrecisionMismatchException" data-throw-if-not-resolved="false"></xref> without it; ordering throws on a

    mismatched precision too, while equality returns <code>false</code>. See

    <xref href="Virtufin.Core.Position.DecimalAmount" data-throw-if-not-resolved="false"></xref> for why those two differ.
