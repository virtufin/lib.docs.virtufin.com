    startLine: 113
  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: Indicates whether the current object is equal to another object of the same type.
  remarks: >-
    Precision is part of identity: an amount at a different <code>N</code> is a different

    value, never an equal one. It returns <code>false</code> rather than throwing, unlike

    <xref href="Virtufin.Core.Position.BinaryAmount.CompareTo(Virtufin.Core.Position.BinaryAmount)" data-throw-if-not-resolved="false"></xref> -- that asymmetry is deliberate and mirrors the BCL,

    where a type mismatch makes <xref href="System.Object.Equals(System.Object)" data-throw-if-not-resolved="false"></xref> return <code>false</code>

    but <xref href="System.IComparable.CompareTo(System.Object)" data-throw-if-not-resolved="false"></xref> throw. Equality is called

    implicitly by dictionaries, <code>Contains</code>, <code>Distinct</code> and by the generated

    equality of any record holding an amount, where a throw cannot be caught.
  example: []
  syntax:
    content: public bool Equals(BinaryAmount other)
    parameters:
    - id: other
      type: Virtufin.Core.Position.BinaryAmount
      description: An object to compare with this object.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the current object is equal to the <code class="paramref">other</code> parameter; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    content.vb: Public Function Equals(other As BinaryAmount) As Boolean
  overload: Virtufin.Core.Position.BinaryAmount.Equals*
  implements:
  - System.IEquatable{Virtufin.Core.Position.BinaryAmount}.Equals(Virtufin.Core.Position.BinaryAmount)
