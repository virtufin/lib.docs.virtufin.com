  syntax:
    content: 'public readonly record struct BinaryAmount : IFixedPointAmount<BinaryAmount>, IFixedPointAmount, IAmount, IComparable<BinaryAmount>, IAsCardinal<long>, IAdditionOperators<BinaryAmount, BinaryAmount, BinaryAmount>, ISubtractionOperators<BinaryAmount, BinaryAmount, BinaryAmount>, IMultiplyOperators<BinaryAmount, BinaryAmount, BinaryAmount>, IDivisionOperators<BinaryAmount, BinaryAmount, BinaryAmount>, IEquatable<BinaryAmount>'
    content.vb: Public Structure BinaryAmount Implements IFixedPointAmount(Of BinaryAmount), IFixedPointAmount, IAmount, IComparable(Of BinaryAmount), IAsCardinal(Of Long), IAdditionOperators(Of BinaryAmount, BinaryAmount, BinaryAmount), ISubtractionOperators(Of BinaryAmount, BinaryAmount, BinaryAmount), IMultiplyOperators(Of BinaryAmount, BinaryAmount, BinaryAmount), IDivisionOperators(Of BinaryAmount, BinaryAmount, BinaryAmount), IEquatable(Of BinaryAmount)
  implements:
