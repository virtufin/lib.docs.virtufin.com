  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    Base- and precision-aware arithmetic for <xref href="Virtufin.Core.Position.IFixedPointAmount" data-throw-if-not-resolved="false"></xref>,

    following the standard fixed-point algorithms (see

    https://en.wikipedia.org/wiki/Fixed-point_arithmetic).
  remarks: >-
    <p>

    Addition and subtraction require a common scaling factor (same base and

    precision) and throw <xref href="Virtufin.Core.Position.PrecisionMismatchException" data-throw-if-not-resolved="false"></xref> otherwise.

    </p>

    <p>

    Multiplication and division support differing base and precision. Both take

    an explicit <code class="paramref">resultBase</code> and <code class="paramref">resultPrecision</code>

    so the caller owns the target scale; the result is rounded half away from

    zero. The concrete result type is chosen by the generic parameter and its

    base must match <code class="paramref">resultBase</code>.

    </p>

    <p>

    All intermediates use <xref href="System.Numerics.BigInteger" data-throw-if-not-resolved="false"></xref>; the final decomposition is

    checked against <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> (whole) and <xref href="System.UInt64" data-throw-if-not-resolved="false"></xref>

    (fraction) and throws <xref href="System.OverflowException" data-throw-if-not-resolved="false"></xref> when it does not fit.

    </p>
