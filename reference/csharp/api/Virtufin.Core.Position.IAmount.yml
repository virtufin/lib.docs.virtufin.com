  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    Non-generic root for any typed monetary or physical quantity.

    <xref href="Virtufin.Core.Position.IAmount.Precision" data-throw-if-not-resolved="false"></xref> is the scale of the value's fractional part;

    implementations that represent a scale-free quantity (e.g. a whole

    count) use <code>0</code>.
  remarks: >-
    Ordering across differing precisions is not meaningful and must be

    rejected by implementations (see <xref href="Virtufin.Core.Position.PrecisionMismatchException" data-throw-if-not-resolved="false"></xref>).

    C# has no dependent types, so this invariant is enforced at runtime.
  example: []
  syntax:
    content: public interface IAmount
    content.vb: Public Interface IAmount
  derivedClasses:
