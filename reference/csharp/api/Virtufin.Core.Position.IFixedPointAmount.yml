  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    A fixed-point amount: a value stored as a whole part and a fractional part

    interpreted in a given <xref href="Virtufin.Core.Position.IFixedPointAmount.Base" data-throw-if-not-resolved="false"></xref> with <xref href="Virtufin.Core.Position.IAmount.Precision" data-throw-if-not-resolved="false"></xref>

    fractional digits. The represented value is

    <code>Whole + Fraction / Base^Precision</code>, or equivalently

    <code>ToCardinal() / Base^Precision</code>.
  remarks: >-
    Base and precision are part of the value's identity: equality, ordering,

    and addition/subtraction across differing base or precision are rejected

    (see <xref href="Virtufin.Core.Position.PrecisionMismatchException" data-throw-if-not-resolved="false"></xref>). Multiplication/division

    across differing base or precision are supported through

    <xref href="Virtufin.Core.Position.FixedPointArithmetic" data-throw-if-not-resolved="false"></xref>, which takes an explicit result scale.
  example: []
  syntax:
    content: 'public interface IFixedPointAmount : IAmount'
    content.vb: Public Interface IFixedPointAmount Inherits IAmount
