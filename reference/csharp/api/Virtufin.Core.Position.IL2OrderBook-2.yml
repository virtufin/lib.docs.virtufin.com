  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    A Level-2 (market-by-price) order book: aggregated price levels per side.

    <code class="typeparamref">A</code> is the depth (size) amount type and

    <code class="typeparamref">L</code> the level (price) amount type.
  remarks: >-
    <p>

    The two dimensions carry independent, fixed scales:

    <xref href="Virtufin.Core.Position.IL2OrderBook%602.LevelBase" data-throw-if-not-resolved="false"></xref>/<xref href="Virtufin.Core.Position.IL2OrderBook%602.LevelPrecision" data-throw-if-not-resolved="false"></xref> for prices and

    <xref href="Virtufin.Core.Position.IL2OrderBook%602.DepthBase" data-throw-if-not-resolved="false"></xref>/<xref href="Virtufin.Core.Position.IL2OrderBook%602.DepthPrecision" data-throw-if-not-resolved="false"></xref> for sizes. They need

    not match (a book quoted in ticks to 2 decimal places may size in lots to

    6), and values are never compared across the two dimensions.

    </p>

    <p>

    Enumeration is best-first: bids highest price first, asks lowest price first.

    </p>
  example: []
  syntax:
    content: 'public interface IL2OrderBook<A, L> : IOrderBook where A : IFixedPointAmount where L : IFixedPointAmount'
    typeParameters:
    - id: A
    - id: L
    content.vb: Public Interface IL2OrderBook(Of A As IFixedPointAmount, L As IFixedPointAmount) Inherits IOrderBook
