  namespace: Virtufin.Core.Position
  summary: >-
    Non-generic marker for a maintained order book. The concrete shapes are

    <xref href="Virtufin.Core.Position.IL2OrderBook%602" data-throw-if-not-resolved="false"></xref> (aggregated price levels) and

    <xref href="Virtufin.Core.Position.IL3OrderBook%604" data-throw-if-not-resolved="false"></xref> (individual orders).
  remarks: >-
    Intentionally empty: the two shapes share no members that are meaningful for

    both. Snapshot/diff application is abstracted separately by

    <xref href="Virtufin.Core.Position.IOrderBookUpdater%603" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public interface IOrderBook
    content.vb: Public Interface IOrderBook
  derivedClasses:
  - Virtufin.Base.OrderBooks.L2OrderBook`2
