  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    Applies venue snapshot/diff data to a maintained <code class="typeparamref">TBook</code>.

    <code class="typeparamref">S</code> is the snapshot data type and <code class="typeparamref">D</code>

    the diff data type.
  remarks: >-
    The updater is stateless: all live state (levels, update id, lifecycle)

    lives on the book, so one updater instance can serve many books.
  example: []
  syntax:
    content: 'public interface IOrderBookUpdater<TBook, S, D> where TBook : IOrderBook'
    typeParameters:
    - id: TBook
      description: Maintained book type.
    - id: S
      description: Snapshot data type.
    - id: D
      description: Diff data type.
    content.vb: Public Interface IOrderBookUpdater(Of TBook As IOrderBook, S, D)
