  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    An append-only collection of orders / transactions representing the live

    book at a venue. The transaction type is the generic

    <xref href="Virtufin.Core.Contracts.ITransaction" data-throw-if-not-resolved="false"></xref> from <code>Virtufin.Core.Contracts</code> so orders of

    any concrete kind can be accommodated.
  remarks: >-
    Formerly named <code>IOrderBook</code>; renamed to free that name for the

    market-data order-book hierarchy (<xref href="Virtufin.Core.Position.IOrderBook" data-throw-if-not-resolved="false"></xref>,

    <xref href="Virtufin.Core.Position.IL2OrderBook%602" data-throw-if-not-resolved="false"></xref>, <xref href="Virtufin.Core.Position.IL3OrderBook%604" data-throw-if-not-resolved="false"></xref>).
