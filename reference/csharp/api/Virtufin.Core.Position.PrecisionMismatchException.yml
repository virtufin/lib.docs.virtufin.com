  assemblies:
  - Virtufin.Core
  namespace: Virtufin.Core.Position
  summary: >-
    Thrown when two <xref href="Virtufin.Core.Position.IFixedPointAmount" data-throw-if-not-resolved="false"></xref> values are combined by an

    operation that requires a common scaling factor (equality, ordering,

    addition, subtraction) but their base and/or precision differ.
  remarks: >-
    The invariant is enforced at runtime because C# lacks dependent types: a

    fixed-point amount's base and precision cannot be encoded in its static

    type, so the compiler cannot reject a mismatched operation.
  example: []
  syntax:
