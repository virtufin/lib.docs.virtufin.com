  namespace: Virtufin.Core.Predicates
  summary: >-
    A composable filter that decides whether a given <xref href="Virtufin.Core.Contracts.IMessage" data-throw-if-not-resolved="false"></xref>

    should be considered for a given <xref href="Virtufin.Core.Contracts.IContract" data-throw-if-not-resolved="false"></xref> at a given time

    and scenario history.
  remarks: >-
    Implementations must be displayable so composite predicates

    (<xref href="Virtufin.Core.Predicates.AllMessageSelectorPredicate" data-throw-if-not-resolved="false"></xref>) can render a human-readable

    summary of the composed filter.
