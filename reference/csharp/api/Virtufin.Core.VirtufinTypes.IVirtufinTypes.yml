  namespace: Virtufin.Core.VirtufinTypes
  summary: >-
    Resolves the runtime <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of each canonical

    identifier and payload in the financial contract model. Allows code in

    <code>Virtufin.Core</code> to refer to "the type of Signatory used here" without

    taking a hard dependency on the concrete implementations in

    <code>Virtufin.Base</code>.
  remarks: >-
    Default concrete implementation lives in <code>Virtufin.Base</code> as

    <code>DefaultVirtufinTypes</code>. Wire that into DI as a singleton.
  example: []
  syntax:
    content: public interface IVirtufinTypes
    content.vb: Public Interface IVirtufinTypes
  derivedClasses:
  - Virtufin.Base.DefaultVirtufinTypes
